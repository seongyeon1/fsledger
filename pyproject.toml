[project]
name = "fsledger"
version = "0.1.0"
description = "Local file change ledger: git-style stat cache, temporal history, duplicate and junk detection, reversible organizing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fsledger = "fsledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsledger"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
